name: 🐛 Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug — what did you do, what did you expect, what happened instead?
      placeholder: "When the interviewer asks a follow-up question, the app ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start recording
        2. ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0 (or commit hash when running from source)"
    validations:
      required: true

  - type: input
    id: models
    attributes:
      label: Models in use (if relevant)
      placeholder: "STT: openai/gpt-4o-mini-transcribe, LLM: anthropic/claude-4.5-haiku"

  - type: textarea
    id: logs
    attributes:
      label: Error messages / logs
      description: Errors from the transcript panel, answer cards, or the DevTools console. **Remove anything personal or sensitive first.**
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed all personal/sensitive data (API keys, real conversation content) from this report
          required: true
